name: Resume Robinhood Testnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Enter RESUME_NAKAMA_ROBINHOOD_TESTNET_FROM_RUN_30250458380
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: robinhood-testnet-deployment
  cancel-in-progress: false

jobs:
  recover-verify-deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RESUME_NAKAMA_ROBINHOOD_TESTNET_FROM_RUN_30250458380'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: robinhood-testnet
    env:
      RECOVERY_RUN_ID: "30250458380"
      DEPLOYED_SOURCE_COMMIT: 8de29078edb5444dd0e42e747b2f4cf7564b6a7d
      DEPLOYED_ASSET_ADDRESS: "0xB4bF6791bb7a3125E5e62BA0e5481247adA54C18"
      DEPLOYED_ASSET_TRANSACTION: "0xc71133ca2ba9c1b3e6d020541ba707d93254fe5e65f72daa8359ce376afa6b58"
      DEPLOYED_ASSET_PENDING_SHA256: 3ebbd6a65d9d1af47fd313e5da6593bd44ff4308aef82be1683cf6f692ebae5c
      DEPLOYED_ASSET_BROADCAST_SHA256: 8da6ccaa1b8e8e369b625198fb6d1e01f964f6508880cf0ed57c4465ae931a9c
      QUALIFICATION_SHA256: 08778b6ee3333c64843028720c8aef2bd9a7d36b168a335644848d8df78b0fff
      APPROVAL_SHA256: 5cfbdb372bd0596a547310fc92746f8b9695e636571cd8cc7f7b76b0f36b9a55
      ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
      ROBINHOOD_TESTNET_RPC_FALLBACK_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_FALLBACK_URL }}
      ROBINHOOD_TESTNET_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_PRIVATE_KEY }}
      NAKAMA_ROBINHOOD_GENERIC_TESTNET_EXPECTED_DEPLOYER: ${{ vars.ROBINHOOD_TESTNET_DEPLOYER_ADDRESS }}
      NAKAMA_ROBINHOOD_GENERIC_TESTNET_CONFIRMATIONS: "20"
      NAKAMA_ROBINHOOD_GENERIC_TESTNET_MIN_DEPLOYER_BALANCE_WEI: "5000000000000000"
      NAKAMA_ROBINHOOD_GENERIC_TESTNET_DEPLOY_CONFIRMATION: DEPLOY_IMMUTABLE_NAKAMA_GENERIC_CORE_TO_ROBINHOOD_TESTNET
      ROBINHOOD_TESTNET_SETTLEMENT_ASSET_ADDRESS: "0xB4bF6791bb7a3125E5e62BA0e5481247adA54C18"
      ROBINHOOD_TESTNET_SETTLEMENT_ASSET_NAME: Nakama Test USD
      ROBINHOOD_TESTNET_SETTLEMENT_ASSET_SYMBOL: tUSDG
      ROBINHOOD_TESTNET_SETTLEMENT_ASSET_DECIMALS: "6"
      ROBINHOOD_TESTNET_SETTLEMENT_ASSET_DEPLOYMENT_TRANSACTION: "0xc71133ca2ba9c1b3e6d020541ba707d93254fe5e65f72daa8359ce376afa6b58"

    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOYED_SOURCE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Requalify exact source and providers
        run: |
          test -n "$ROBINHOOD_TESTNET_RPC_URL"
          test -n "$ROBINHOOD_TESTNET_RPC_FALLBACK_URL"
          test "$ROBINHOOD_TESTNET_RPC_URL" != "$ROBINHOOD_TESTNET_RPC_FALLBACK_URL"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm run ethereum:contract:check
          npm run robinhood:test

      - name: Recover exact prior deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/recovery"
          gh run download "$RECOVERY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/recovery"
          asset_pending="$(
            find "$RUNNER_TEMP/recovery" \
              -type f \
              -name test-settlement-asset.pending.json \
              -print \
              -quit
          )"
          asset_broadcast="$(
            find "$RUNNER_TEMP/recovery" \
              -type f \
              -name test-settlement-asset.broadcast.json \
              -print \
              -quit
          )"
          qualification="$(
            find "$RUNNER_TEMP/recovery" \
              -type f \
              -name robinhood-testnet-qualification.json \
              -print \
              -quit
          )"
          approval="$(
            find "$RUNNER_TEMP/recovery" \
              -type f \
              -name robinhood-testnet-approval.json \
              -print \
              -quit
          )"
          test -n "$asset_pending"
          test -n "$asset_broadcast"
          test -n "$qualification"
          test -n "$approval"
          echo "$DEPLOYED_ASSET_PENDING_SHA256  $asset_pending" | sha256sum --check -
          echo "$DEPLOYED_ASSET_BROADCAST_SHA256  $asset_broadcast" | sha256sum --check -
          echo "$QUALIFICATION_SHA256  $qualification" | sha256sum --check -
          echo "$APPROVAL_SHA256  $approval" | sha256sum --check -
          mkdir -p deployments/robinhood-testnet
          cp "$asset_pending" \
            deployments/robinhood-testnet/test-settlement-asset.pending.json
          cp "$asset_broadcast" \
            deployments/robinhood-testnet/test-settlement-asset.broadcast.json
          cp "$qualification" "$RUNNER_TEMP/robinhood-testnet-qualification.json"
          cp "$approval" "$RUNNER_TEMP/robinhood-testnet-approval.json"
          echo "ROBINHOOD_QUALIFICATION_PATH=$RUNNER_TEMP/robinhood-testnet-qualification.json" >> "$GITHUB_ENV"
          echo "ROBINHOOD_APPROVAL_PATH=$RUNNER_TEMP/robinhood-testnet-approval.json" >> "$GITHUB_ENV"

      - name: Validate recovered asset and signer state
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          import { JsonRpcProvider, getAddress } from "ethers";

          const pending = JSON.parse(
            await readFile(
              "deployments/robinhood-testnet/test-settlement-asset.pending.json",
              "utf8"
            )
          );
          const expectedDeployer = getAddress(
            process.env.NAKAMA_ROBINHOOD_GENERIC_TESTNET_EXPECTED_DEPLOYER
          );
          if (
            pending.status !== "deployed-unverified" ||
            pending.sourceCommit !== process.env.DEPLOYED_SOURCE_COMMIT ||
            getAddress(pending.address) !==
              getAddress(process.env.DEPLOYED_ASSET_ADDRESS) ||
            pending.deploymentTransaction.toLowerCase() !==
              process.env.DEPLOYED_ASSET_TRANSACTION.toLowerCase() ||
            getAddress(pending.deployer) !== expectedDeployer ||
            pending.productionEnabled !== false
          ) {
            throw new Error("Recovered settlement-asset evidence does not match");
          }
          const providers = [
            new JsonRpcProvider(
              process.env.ROBINHOOD_TESTNET_RPC_URL,
              undefined,
              { batchMaxCount: 1 }
            ),
            new JsonRpcProvider(
              process.env.ROBINHOOD_TESTNET_RPC_FALLBACK_URL,
              undefined,
              { batchMaxCount: 1 }
            ),
          ];
          const states = await Promise.all(
            providers.map(async (provider) => {
              const [network, code, receipt, latestNonce, pendingNonce, balance] =
                await Promise.all([
                  provider.getNetwork(),
                  provider.getCode(pending.address),
                  provider.getTransactionReceipt(
                    pending.deploymentTransaction
                  ),
                  provider.getTransactionCount(expectedDeployer, "latest"),
                  provider.getTransactionCount(expectedDeployer, "pending"),
                  provider.getBalance(expectedDeployer),
                ]);
              return {
                chainId: network.chainId,
                code,
                receipt,
                latestNonce,
                pendingNonce,
                balance,
              };
            })
          );
          for (const state of states) {
            if (
              state.chainId !== 46630n ||
              state.code === "0x" ||
              state.receipt?.status !== 1 ||
              getAddress(state.receipt.contractAddress) !==
                getAddress(pending.address) ||
              state.latestNonce !== 1 ||
              state.pendingNonce !== 1 ||
              state.balance < 5000000000000000n
            ) {
              throw new Error(
                "Providers do not agree on the recovered asset or signer nonce"
              );
            }
          }
          NODE

      - name: Verify recovered settlement asset source
        run: |
          git restore --source="$GITHUB_SHA" -- hardhat.config.ts
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm run robinhood:generic:testnet:verify:blockscout -- \
              --contract contracts/testnet/NakamaTestUsd.sol:NakamaTestUsd \
              "$DEPLOYED_ASSET_ADDRESS" \
              "$NAKAMA_ROBINHOOD_GENERIC_TESTNET_EXPECTED_DEPLOYER" \
              "1000000000000"; then
              break
            fi
            test "$attempt" -lt 8
            sleep 30
          done
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm run robinhood:generic:testnet:verify:sourcify -- \
              --contract contracts/testnet/NakamaTestUsd.sol:NakamaTestUsd \
              "$DEPLOYED_ASSET_ADDRESS" \
              "$NAKAMA_ROBINHOOD_GENERIC_TESTNET_EXPECTED_DEPLOYER" \
              "1000000000000" \
              --creation-tx-hash "$DEPLOYED_ASSET_TRANSACTION"; then
              break
            fi
            test "$attempt" -lt 8
            sleep 30
          done
          git restore --source="$DEPLOYED_SOURCE_COMMIT" -- hardhat.config.ts
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Prepare reviewed testnet release
        run: |
          node scripts/prepare_robinhood_generic_testnet_release.mjs \
            --asset deployments/robinhood-testnet/test-settlement-asset.pending.json \
            --qualification "$ROBINHOOD_QUALIFICATION_PATH" \
            --approval "$ROBINHOOD_APPROVAL_PATH" \
            --output deployments/robinhood-testnet/generic-core.release.json
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";

          const release = JSON.parse(
            await readFile(
              "deployments/robinhood-testnet/generic-core.release.json",
              "utf8"
            )
          );
          const lines = [
            `NAKAMA_ROBINHOOD_GENERIC_TESTNET_SOURCE_COMMIT=${release.sourceCommit}`,
            `NAKAMA_ROBINHOOD_GENERIC_TESTNET_QUALIFICATION_SHA256=${release.qualificationReportSha256}`,
            `NAKAMA_ROBINHOOD_GENERIC_TESTNET_RELEASE_APPROVAL_SHA256=${release.releaseApprovalSha256}`,
          ];
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_ENV, `${lines.join("\n")}\n`)
          );
          NODE

      - name: Preflight immutable generic core
        run: npm run robinhood:generic:testnet:preflight

      - name: Deploy immutable generic core
        run: npm run robinhood:generic:testnet:deploy

      - name: Bind core deployment addresses
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";

          const deployment = JSON.parse(
            await readFile(
              "deployments/robinhood-testnet/generic-core.pending.json",
              "utf8"
            )
          );
          const values = {
            ROBINHOOD_FACTORY_ADDRESS:
              deployment.liveContracts.factory.address,
            ROBINHOOD_POLICY_REGISTRY_ADDRESS:
              deployment.liveContracts.policyRegistry.address,
            ROBINHOOD_PROTOCOL_ADDRESS:
              deployment.liveContracts.protocol.address,
            ROBINHOOD_FACTORY_DEPLOYMENT_TRANSACTION:
              deployment.deploymentTransaction,
          };
          const lines = Object.entries(values)
            .map(([key, value]) => `${key}=${value}`)
            .join("\n");
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_ENV, `${lines}\n`)
          );
          NODE

      - name: Verify immutable core source
        run: |
          git restore --source="$GITHUB_SHA" -- hardhat.config.ts
          verify_with_retry() {
            for attempt in 1 2 3 4 5 6 7 8; do
              if "$@"; then
                return 0
              fi
              test "$attempt" -lt 8
              sleep 30
            done
          }
          verify_with_retry \
            npm run robinhood:generic:testnet:verify:blockscout -- \
              --contract contracts/NakamaProtocolFactory.sol:NakamaProtocolFactory \
              "$ROBINHOOD_FACTORY_ADDRESS"
          verify_with_retry \
            npm run robinhood:generic:testnet:verify:blockscout -- \
              --contract contracts/NakamaPolicyRegistry.sol:NakamaPolicyRegistry \
              "$ROBINHOOD_POLICY_REGISTRY_ADDRESS" \
              "$ROBINHOOD_PROTOCOL_ADDRESS"
          verify_with_retry \
            npm run robinhood:generic:testnet:verify:blockscout -- \
              --contract contracts/NakamaCoverageProtocol.sol:NakamaCoverageProtocol \
              "$ROBINHOOD_PROTOCOL_ADDRESS" \
              "$ROBINHOOD_POLICY_REGISTRY_ADDRESS"
          verify_with_retry \
            npm run robinhood:generic:testnet:verify:sourcify -- \
              --contract contracts/NakamaProtocolFactory.sol:NakamaProtocolFactory \
              "$ROBINHOOD_FACTORY_ADDRESS" \
              --creation-tx-hash "$ROBINHOOD_FACTORY_DEPLOYMENT_TRANSACTION"
          verify_with_retry \
            npm run robinhood:generic:testnet:verify:sourcify -- \
              --contract contracts/NakamaPolicyRegistry.sol:NakamaPolicyRegistry \
              "$ROBINHOOD_POLICY_REGISTRY_ADDRESS" \
              "$ROBINHOOD_PROTOCOL_ADDRESS" \
              --creation-tx-hash "$ROBINHOOD_FACTORY_DEPLOYMENT_TRANSACTION"
          verify_with_retry \
            npm run robinhood:generic:testnet:verify:sourcify -- \
              --contract contracts/NakamaCoverageProtocol.sol:NakamaCoverageProtocol \
              "$ROBINHOOD_PROTOCOL_ADDRESS" \
              "$ROBINHOOD_POLICY_REGISTRY_ADDRESS" \
              --creation-tx-hash "$ROBINHOOD_FACTORY_DEPLOYMENT_TRANSACTION"
          git restore --source="$DEPLOYED_SOURCE_COMMIT" -- hardhat.config.ts
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Promote disabled testnet runtime
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm run robinhood:generic:testnet:promote -- \
              --deployment deployments/robinhood-testnet/generic-core.pending.json \
              --runtime-output deployments/robinhood-testnet/generic-core.runtime.json \
              --evidence-output deployments/robinhood-testnet/generic-core.verification-evidence.json; then
              exit 0
            fi
            test "$attempt" -lt 8
            sleep 30
          done

      - name: Record recovery provenance
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { writeFile } from "node:fs/promises";

          const provenance = {
            schemaVersion: 1,
            status: "recovered-prior-deployment",
            priorWorkflowRunId: process.env.RECOVERY_RUN_ID,
            sourceCommit: process.env.DEPLOYED_SOURCE_COMMIT,
            recoveryWorkflowCommit: process.env.GITHUB_SHA,
            settlementAssetAddress: process.env.DEPLOYED_ASSET_ADDRESS,
            settlementAssetTransaction:
              process.env.DEPLOYED_ASSET_TRANSACTION,
            evidenceSha256: {
              pending: process.env.DEPLOYED_ASSET_PENDING_SHA256,
              broadcast: process.env.DEPLOYED_ASSET_BROADCAST_SHA256,
              qualification: process.env.QUALIFICATION_SHA256,
              approval: process.env.APPROVAL_SHA256,
            },
            providers: [
              {
                hostname: new URL(
                  process.env.ROBINHOOD_TESTNET_RPC_URL
                ).hostname,
              },
              {
                hostname: new URL(
                  process.env.ROBINHOOD_TESTNET_RPC_FALLBACK_URL
                ).hostname,
              },
            ],
            productionEnabled: false,
          };
          await writeFile(
            `${process.env.RUNNER_TEMP}/robinhood-testnet-recovery.json`,
            `${JSON.stringify(provenance, null, 2)}\n`,
            { flag: "wx", mode: 0o600 }
          );
          NODE

      - name: Package operator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robinhood-testnet-recovery-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/robinhood-testnet-qualification.json
            ${{ runner.temp }}/robinhood-testnet-approval.json
            ${{ runner.temp }}/robinhood-testnet-recovery.json
            deployments/robinhood-testnet/test-settlement-asset.broadcast.json
            deployments/robinhood-testnet/test-settlement-asset.pending.json
            deployments/robinhood-testnet/generic-core.release.json
            deployments/robinhood-testnet/generic-core.broadcast.json
            deployments/robinhood-testnet/generic-core.pending.json
            deployments/robinhood-testnet/generic-core.runtime.json
            deployments/robinhood-testnet/generic-core.verification-evidence.json
